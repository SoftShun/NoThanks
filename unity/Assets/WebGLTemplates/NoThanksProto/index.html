<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0E0C10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <script>window.__ntT0 = performance.now();</script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0E0C10; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0E0C10; outline: none; }
      #nt-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #EBCB86; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; gap: 14px; }
      #nt-bar { width: min(240px, 60vw); height: 4px; background: #2a2026; border-radius: 2px; overflow: hidden; }
      #nt-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #7A6236, #EBCB86); transition: width 120ms linear; }
      #nt-time { font-size: 12px; color: #A3968B; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="nt-loading"><div>{{{ PRODUCT_NAME }}}</div><div id="nt-bar"><div id="nt-fill"></div></div><div id="nt-time"></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#nt-fill");
      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: true,
        devicePixelRatio: window.devicePixelRatio || 1
      }, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
      }).then(function (instance) {
        window.__ntLoadMs = performance.now() - window.__ntT0;
        console.log("[NoThanksProto] load ms:", Math.round(window.__ntLoadMs));
        document.querySelector("#nt-loading").remove();
        window.unityInstance = instance;
      }).catch(function (message) {
        document.querySelector("#nt-time").textContent = "로딩 실패: " + message;
      });
    </script>
  </body>
</html>
